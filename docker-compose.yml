# Local development only. Every value comes from .env (copy .env.example) or the defaults below;
# the defaults are throwaway local placeholders - never commit a real credential.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: supportdesk-api
    container_name: supportdesk-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # Development: Swagger, plus migrate-and-seed on start-up (see README, "Docker").
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      # Reaches SQL Server by its service name on the compose network.
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      # No default on purpose: without it in .env the API stops at start-up, naming the setting.
      Jwt__SigningKey: "${Jwt__SigningKey:-}"
    ports:
      - "5080:8080"

volumes:
  supportdesk-sql:
